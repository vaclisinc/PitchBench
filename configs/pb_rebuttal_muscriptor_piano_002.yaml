schema_version: 1

experiment:
  experiment_id: "PB-REBUTTAL-MUSCRIPTOR-PIANO-002"
  kind: "formal"
  rq_id: "RQ-REBUTTAL-MUSCRIPTOR-PIANO"
  why: "Measure piano-conditioned MuScriptor with task-semantic sequence and nearest-pitch adapters on all 28 PitchBench experiments."
  hypothesis: "Task-semantic conversion will reduce event-fragmentation penalties while retaining the observed benefit of piano conditioning on polyphonic melodic lines."
  compare_to: "PB-REBUTTAL-MUSCRIPTOR-PIANO-001 under the same data, seed, checkpoint, acoustic-piano conditioning, greedy decoding, prompts, and scorers."
  decision: "Use this piano-conditioned result as the MuScriptor rebuttal reference if all protocol checks pass."
  expected_evidence: "Raw predictions and per-experiment scores over the exact 5,802-example protocol, including F1/F2 scores sliced by requested voice and D2 scores sliced by cents."

benchmark:
  mode: "paper_locked"
  sample_seed: 42
  experiments:
    - "a1"
    - "a2"
    - "a3"
    - "b1"
    - "b2"
    - "b3"
    - "b4"
    - "b5"
    - "c1"
    - "c2"
    - "c3"
    - "c4"
    - "d1"
    - "d2"
    - "d3"
    - "d4"
    - "d5"
    - "d6"
    - "d7a"
    - "d8"
    - "e1"
    - "e2"
    - "e3"
    - "e4"
    - "e5"
    - "e6"
    - "f1"
    - "f2"
  expected_experiment_count: 28
  expected_condition_count: 5802

input_dataset:
  repository: "pitchbench-authors/PitchBench"
  repository_type: "dataset"
  revision: "f6c672608057cb877bfaacaeeff9bfb49eef7778"
  license: "CC-BY-4.0"
  local_dir: "/tmp/pitchbench-pb-rebuttal-baselines-001/official_hf"
  split: "test"
  parquet_filename: "test-00000-of-00001.parquet"
  embedded_audio_field: "audio"
  verify_embedded_audio: true
  write_shard_sha256: true

runtime:
  python: "3.11.15"
  runtime_root: "/tmp/pitchbench-pb-rebuttal-baselines-001"
  environment_dir: "../../../ntu-music-generation/.venv"
  additional_site_packages: "/tmp/pitchbench-pb-rebuttal-baselines-001-venv/lib/python3.11/site-packages"
  persistent_results_dir: "results/evaluation/PB-REBUTTAL-MUSCRIPTOR-PIANO-002"
  logs_dir: "logs/PB-REBUTTAL-MUSCRIPTOR-PIANO-002"
  tmux_session: "pitchbench-pb-rebuttal-muscriptor-piano-002"
  cuda_visible_devices: "1"
  formal_command: "CUDA_VISIBLE_DEVICES=1 PYTHONPATH=/tmp/pitchbench-pb-rebuttal-baselines-001-venv/lib/python3.11/site-packages ../../../ntu-music-generation/.venv/bin/python scripts/run_rebuttal_baselines.py configs/pb_rebuttal_muscriptor_piano_002.yaml --phase all"
  concurrency: 1
  fail_on_missing_prediction: false
  missing_prediction_text: "__NO_DETECTION__"
  packages:
    einops: "0.8.2"
    librosa: "0.10.2.post1"
    mir-eval: "0.7"
    music21: "9.9.1"
    numpy: "1.26.4"
    pandas: "2.2.3"
    pyarrow: "18.1.0"
    safetensors: "0.8.0"
    scipy: "1.13.1"
    soundfile: "0.12.1"
    torch: "2.7.1+cu126"

shared_decoder:
  midi_min: 0
  midi_max: 127
  analysis_midi_min: 21
  analysis_midi_max: 108
  cents_per_semitone: 100.0
  pitch_change_threshold_cents: 12.5
  contour_median_filter_frames: 9
  event_merge_gap_seconds: 0.50
  event_merge_pitch_cents: 50.0
  event_glitch_max_seconds: 0.30
  event_pitch_split_threshold_cents: 50.0
  event_pitch_split_median_frames: 5
  minimum_event_seconds: 0.05
  steady_state_start_fraction: 0.20
  steady_state_end_fraction: 0.80
  d2_first_region_fractions: [0.05, 0.30]
  d2_second_region_fractions: [0.70, 0.95]
  chord_templates:
    major: [0, 4, 7]
    minor: [0, 3, 7]
    diminished: [0, 3, 6]
    augmented: [0, 4, 8]
    dominant seventh: [0, 4, 7, 10]
    major seventh: [0, 4, 7, 11]
    minor seventh: [0, 3, 7, 10]
    half diminished: [0, 3, 6, 10]
    sus2: [0, 2, 7]
    sus4: [0, 5, 7]
  chord_template_tie_order:
    - "major"
    - "minor"
    - "diminished"
    - "augmented"
    - "dominant seventh"
    - "major seventh"
    - "minor seventh"
    - "half diminished"
    - "sus2"
    - "sus4"

baselines:
  muscriptor:
    model_name: "baseline/muscriptor"
    implementation: "MuScriptor medium greedy multi-instrument audio-to-MIDI transcription with acoustic-piano conditioning"
    source_dir: "../../../ntu-music-generation/external/muscriptor"
    source_revision: "e400b9839b04b14db7a08a3c07896e714351592f"
    checkpoint: "../../../ntu-music-generation/checkpoints/muscriptor-medium/model.safetensors"
    checkpoint_revision: "f3223696"
    checkpoint_sha256: "ac80adbdf85d87231735fd948af7013441c0afced316c4e9067fd5d8a7fb97ec"
    checkpoint_license: "CC-BY-NC-4.0"
    device: "cuda"
    use_sampling: false
    temperature: 1.0
    cfg_coef: 1.0
    instruments: ["acoustic_piano"]
    batch_size: 16
    no_eos_is_ok: true
    beam_size: 1
    frame_hop_seconds: 0.02
    chord_presence_fraction: 0.30

outputs:
  muscriptor_model_label: "muscriptor_medium_f3223696_acoustic_piano_adapter_v2"
  run_name: "PB-REBUTTAL-MUSCRIPTOR-PIANO-002"
  receipt_json: "results/evaluation/PB-REBUTTAL-MUSCRIPTOR-PIANO-002/receipt.json"
  aggregate_csv: "results/evaluation/PB-REBUTTAL-MUSCRIPTOR-PIANO-002/baseline_aggregate.csv"
  openreview_markdown: "paper/rebuttal_dsp_nn_baselines_openreview.md"
